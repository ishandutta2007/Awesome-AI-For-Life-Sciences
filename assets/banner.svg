<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#111e38"/>
    </linearGradient>

    <!-- Glow & Accents -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="dnaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="dnaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      
      /* Subtle animated pulses and flows */
      @keyframes floatPulse {
        0% { transform: translateY(0px) scale(1); opacity: 0.7; }
        50% { transform: translateY(-8px) scale(1.05); opacity: 1; }
        100% { transform: translateY(0px) scale(1); opacity: 0.7; }
      }
      @keyframes orbitFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 5px; opacity: 0.6; }
        50% { r: 7.5px; opacity: 1; }
      }

      .floating-node-1 { animation: floatPulse 6s ease-in-out infinite; }
      .floating-node-2 { animation: floatPulse 7s ease-in-out infinite 1.5s; }
      .floating-node-3 { animation: floatPulse 5s ease-in-out infinite 3s; }
      .pulse-ring { animation: orbitFlow 14s linear infinite; }
      .pulsing-atom { animation: nodeGlow 3s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="340" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Background Decorative Grid -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="68" x2="1200" y2="68"/>
    <line x1="0" y1="136" x2="1200" y2="136"/>
    <line x1="0" y1="204" x2="1200" y2="204"/>
    <line x1="0" y1="272" x2="1200" y2="272"/>
    <line x1="200" y1="0" x2="200" y2="340"/>
    <line x1="400" y1="0" x2="400" y2="340"/>
    <line x1="600" y1="0" x2="600" y2="340"/>
    <line x1="800" y1="0" x2="800" y2="340"/>
    <line x1="1000" y1="0" x2="1000" y2="340"/>
  </g>

  <!-- Ambient Light Orbs (Background layer) -->
  <circle cx="1020" cy="170" r="130" fill="#3b82f6" opacity="0.15" filter="url(#glow)"/>
  <circle cx="150" cy="80" r="90" fill="#10b981" opacity="0.12" filter="url(#glow)"/>
  <circle cx="600" cy="280" r="100" fill="#8b5cf6" opacity="0.1" filter="url(#glow)"/>

  <!-- Dynamic / Animated Life Sciences Elements (Right Side Decorative Section) -->
  <g transform="translate(930, 160)">
    <!-- Molecular orbits -->
    <ellipse cx="0" cy="0" rx="140" ry="55" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.4" transform="rotate(30)" stroke-dasharray="8 6" class="pulse-ring"/>
    <ellipse cx="0" cy="0" rx="140" ry="55" fill="none" stroke="#ec4899" stroke-width="1.8" opacity="0.4" transform="rotate(-30)" stroke-dasharray="8 6" class="pulse-ring"/>
    <ellipse cx="0" cy="0" rx="140" ry="55" fill="none" stroke="#10b981" stroke-width="1.8" opacity="0.3" transform="rotate(90)" stroke-dasharray="10 8" class="pulse-ring"/>

    <!-- Central Biomolecule Core -->
    <circle cx="0" cy="0" r="28" fill="url(#primaryGlow)" opacity="0.9" filter="url(#glow)"/>
    <circle cx="0" cy="0" r="14" fill="#ffffff" opacity="0.95"/>

    <!-- Atoms & Nodes linked with bonds -->
    <g stroke="#94a3b8" stroke-width="1.5" opacity="0.6">
      <line x1="0" y1="0" x2="70" y2="-55"/>
      <line x1="0" y1="0" x2="-80" y2="-45"/>
      <line x1="0" y1="0" x2="75" y2="50"/>
      <line x1="0" y1="0" x2="-70" y2="60"/>
    </g>

    <!-- Pulsing Outer Nodes -->
    <circle cx="70" cy="-55" r="9" fill="url(#dnaGrad1)" class="pulsing-atom"/>
    <circle cx="-80" cy="-45" r="8" fill="url(#dnaGrad2)" class="pulsing-atom"/>
    <circle cx="75" cy="50" r="10" fill="url(#dnaGrad2)" class="pulsing-atom"/>
    <circle cx="-70" cy="60" r="9" fill="url(#dnaGrad1)" class="pulsing-atom"/>

    <!-- DNA Strand Segment (Schematic Nodes) -->
    <g class="floating-node-1">
      <circle cx="120" cy="-25" r="5" fill="#38bdf8" opacity="0.8"/>
      <line x1="120" y1="-25" x2="135" y2="5" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
      <circle cx="135" cy="5" r="6" fill="#a855f7" opacity="0.8"/>
    </g>
    <g class="floating-node-2">
      <circle cx="-125" cy="20" r="6" fill="#10b981" opacity="0.8"/>
      <line x1="-125" y1="20" x2="-140" y2="-10" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
      <circle cx="-140" cy="-10" r="5" fill="#38bdf8" opacity="0.8"/>
    </g>
  </g>

  <!-- Foreground Content: Unobstructed & Crisp -->
  <g transform="translate(60, 0)">
    <!-- Top Micro Tag / Pill -->
    <g transform="translate(0, 48)">
      <rect width="250" height="28" rx="14" fill="#0369a1" fill-opacity="0.25" stroke="#0284c7" stroke-width="1"/>
      <circle cx="14" cy="14" r="4.5" fill="#38bdf8" class="pulsing-atom"/>
      <text x="28" y="19" class="badge-text">🧬 AI × LIFE SCIENCES ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="132" class="title">Awesome-AI-For-Life-Sciences</text>

    <!-- Gradient underline accent bar -->
    <rect x="0" y="148" width="560" height="4" rx="2" fill="url(#primaryGlow)"/>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="192" class="subtitle">The definitive directory of SaaS platforms, foundation models &amp; open-source AI</text>
    <text x="0" y="222" class="subtitle" fill="#64748b" font-size="16px">Accelerating Protein Folding • Generative Drug Design • Multi-Omics • Agent Skills</text>

    <!-- Highlights Badges in Foreground -->
    <g transform="translate(0, 260)">
      <!-- Pill 1: Structure Prediction -->
      <g>
        <rect width="165" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#e2e8f0">🔮 Structure Folding</text>
      </g>
      <!-- Pill 2: Drug Discovery -->
      <g transform="translate(177, 0)">
        <rect width="160" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#e2e8f0">💊 Drug Discovery</text>
      </g>
      <!-- Pill 3: Autonomous Agents -->
      <g transform="translate(349, 0)">
        <rect width="180" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#e2e8f0">🤖 Scientific AI Agents</text>
      </g>
      <!-- Pill 4: Open Source -->
      <g transform="translate(541, 0)">
        <rect width="145" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
        <text x="14" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto" font-size="13" font-weight="600" fill="#e2e8f0">🔓 Open-Source</text>
      </g>
    </g>
  </g>
</svg>
